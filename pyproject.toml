[project]
name = "physical-quantities"
version = "0.1.0"
description = "Physical quantities, units, dimensions and unit conversion."
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "ruff",
    "mypy",
]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["other-tests"]

[tool.mypy]
disallow_untyped_defs = true
python_version = "3.14"
files = ["src"]
ignore_missing_imports = true
