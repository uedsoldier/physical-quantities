[project]
name = "physical-quantities"
version = "0.1.0"
description = "Physical quantities, units, dimensions and unit conversion."
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.15",
    "mypy>=1.13",
    "pre-commit>=4.2",
]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# pycodestyle (E/W), pyflakes (F), imports (I), naming (N), pyupgrade (UP), bugbear (B).
select = ["E", "W", "F", "I", "N", "UP", "B", "RUF012", "TRY004"]
# Line length is enforced by `ruff format`; long strings/comments are left alone.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests may use star imports and bare comparisons inside assertRaises.
"tests/**" = ["F403", "F405", "B015", "N806"]

[tool.mypy]
disallow_untyped_defs = true
python_version = "3.14"
files = ["src"]
ignore_missing_imports = true
