[project]
name = "physical-quantities"
version = "0.1.0"
description = "Physical quantities, units, dimensions and unit conversion."
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "ruff",
    "mypy",
]

[tool.uv]
# Virtual project for now: `core/` is imported from the repo root.
# Becomes an installable package (uv_build) when moved to src/physical_quantities/.
package = false

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["other-tests"]

[tool.mypy]
python_version = "3.14"
files = ["core"]
ignore_missing_imports = true
