[project]
name = "power-budget"
version = "0.1.0"
description = "Power budget calculator with SQLite persistence, built on physical-quantities."
requires-python = ">=3.14"
dependencies = ["physical-quantities"]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
physical-quantities = { path = "../..", editable = true }

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F403", "F405", "B015", "N806"]

[dependency-groups]
dev = ["ruff>=0.15", "mypy>=1.13"]

[tool.mypy]
python_version = "3.14"
files = ["src"]
disallow_untyped_defs = true
ignore_missing_imports = true
